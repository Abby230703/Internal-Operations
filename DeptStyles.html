<style>
/* DeptStyles.html - the few styles the Procurement and Warehouse boards need on top of Styles.html (same tokens). */

/* the customer / lead search belongs to Sales */
.dept-procurement #gs,.dept-warehouse #gs{display:none}

.pw-check{display:inline-flex;align-items:center;gap:8px;font:600 13.5px var(--sans);color:var(--ink2);cursor:pointer;white-space:nowrap}
.pw-check input{margin:0}

/* bulk bar (Purchase queue) */
.pw-bar{position:sticky;top:8px;z-index:6;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:16px;padding:10px 16px;box-shadow:0 10px 30px rgba(27,31,59,.3)}
.pw-bar b{font:800 14px var(--head)}
.pw-bar .sp{flex:1}
.pw-bar .inp{height:36px;width:200px;border-radius:10px}
.pw-bar .btn{height:36px}
.pw-bar .btn.soft{background:#fff}

.t td.pw-c,.t th.pw-c{width:34px;padding-left:12px;padding-right:0}
.t td select.inp.sm.pw-sup{min-width:150px}
.t td .inp.sm.pw-n{width:92px}

/* Purchase queue: accepted but not ordered yet stands out */
.t tr.pw-ready td{background:#F1FAF5;border-color:#BCE3CD}
.t tr.pw-ready td:first-child{box-shadow:inset 5px 0 0 var(--ok)}
.t tr.pw-ready.sel td{background:#E3F5EA}
.pw-todo{color:var(--ok)!important;font-weight:700!important}
.seg.chips-s .seg-b.pw-hot:not(.on){background:var(--ok-l);border-color:var(--ok);color:var(--ok)}
.pw-banner{background:var(--ok-l);color:var(--ok);margin:10px 0 0}

/* location chips (Stock, Put-away) */
.pw-locs{display:flex;gap:6px;flex-wrap:wrap}
.pw-chip{font:700 12px var(--sans);background:var(--indigo-l);color:var(--indigo-d);border-radius:99px;padding:3px 10px;white-space:nowrap}
.pw-chip i{font-style:normal;color:var(--mute);font-weight:600;margin-left:4px}

/* receiving / dispatch line cards reuse .line; these are the small extras */
.pw-lines{display:grid;gap:12px}
.pw-lines .line-nums{grid-template-columns:repeat(4,minmax(0,1fr))}
.pw-head{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.pw-head b{font-weight:700}
.pw-exp{font-size:12.5px;color:var(--mute)}
.pw-lock{font:700 12px var(--sans);color:var(--ok);background:var(--ok-l);border-radius:99px;padding:3px 10px}
.pw-ship{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px;align-items:end}
.pw-checks{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding-top:22px}

/* dispatch side panel */
.dp .pw-lines .line{padding:12px}
.dp .pw-lines .line-nums{grid-template-columns:repeat(2,minmax(0,1fr))}
.pw-steps{display:flex;gap:6px;flex-wrap:wrap}
.pw-steps span{font:700 12px var(--sans);border-radius:99px;padding:4px 12px;background:#ECEEF7;color:var(--mute)}
.pw-steps span.done{background:var(--ok-l);color:var(--ok)}
.pw-steps span.now{background:var(--indigo);color:#fff}
.pw-ledger{max-height:360px;overflow:auto}
.pw-neg{color:var(--err);font-weight:700}
.pw-pos{color:var(--ok);font-weight:700}
.pw-note{font-size:12.5px;color:var(--mute)}
.pw-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}

@media (max-width:760px){
  .pw-lines .line-nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pw-bar .inp{width:100%}
}
</style>

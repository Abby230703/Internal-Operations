<style>
/* Hospi Ops - Studio design. Replaces the old Styles.html completely. Class names used by the board scripts are kept. */
:root{
  --indigo:#4252D9;--indigo-d:#3340B8;--indigo-l:#EEF0FF;--indigo-m:#C7CDFA;
  --coral:#F26B4E;--coral-l:#FFEDE8;
  --bg:#F4F5FB;--surface:#FFFFFF;--surface2:#F9FAFE;--line:#E1E4F2;--line2:#ECEEF7;--field:#C3C8E0;
  --ink:#1B1F3B;--ink2:#3B4068;--mute:#5E6486;
  --ok:#146C4C;--ok-l:#E0F5EB;--warn:#8A5700;--warn-l:#FFF0D0;--err:#C0283D;--err-l:#FFE8EB;--info:#3340B8;--info-l:#E9ECFF;
  --head:"Plus Jakarta Sans","DM Sans","Segoe UI",system-ui,sans-serif;--sans:"DM Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --sh:0 1px 2px rgba(27,31,59,.05),0 8px 24px rgba(27,31,59,.06);
  /* legacy names, kept so nothing that still points at them breaks */
  --brand:var(--indigo);--brand-d:var(--indigo-d);--brand-l:var(--indigo-l);--blue:var(--info);--blue-l:var(--info-l);--warn-l2:var(--warn-l);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:400 14.5px/1.5 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--head);margin:0}
h2{font-size:19px;letter-spacing:-.01em}
h3{font-size:16px}
a{color:var(--indigo-d)}
small,.mute{color:var(--mute)}
button{font-family:inherit}
:focus-visible{outline:3px solid #8E99F0;outline-offset:2px}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header: logo, department, search, bell, user, tabs ---------- */
.top{position:relative;z-index:40;background:var(--bg)}
.top-in{max-width:1296px;margin:0 auto;padding:14px 24px 4px}
.top-r1{display:flex;align-items:center;gap:14px}
.top-r2{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:12px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex:none;border-radius:13px;font:800 18px var(--head);letter-spacing:-.02em;color:var(--ink)}
.brand .logo-i{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--indigo),#6D7BF0);color:#fff;display:grid;place-items:center;font:800 18px var(--head)}
.brand .brand-t{display:none}
.brand span{color:inherit;font-weight:inherit;margin:0}
.dept{position:relative;flex:none}
.dsw{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px 0 8px;border-radius:15px;background:#fff;border:1.5px solid var(--line);font:800 16px var(--head);letter-spacing:-.01em;color:var(--ink);cursor:pointer}
.dsw:hover{border-color:var(--indigo)}
.dsw[aria-expanded=true]{border-color:var(--indigo);box-shadow:0 0 0 4px var(--indigo-l)}
.dsw .dt{width:34px;height:34px;border-radius:11px;background:var(--indigo);color:#fff;display:grid;place-items:center;font:800 14px var(--head)}
.dsw .tx{text-align:left;line-height:1.1}
.dsw small{display:block;font:700 10.5px/1 var(--sans);color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.dsw .cv{color:var(--mute);margin-left:4px;width:16px;height:16px}
.dmenu{position:absolute;left:0;top:58px;width:360px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 64px rgba(27,31,59,.24);padding:10px;z-index:60}
.dmenu .hd{font:800 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:8px 12px 6px}
.mi{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;text-decoration:none;color:var(--ink);width:100%;border:0;background:none;text-align:left;font:inherit;cursor:pointer}
.mi:hover{background:var(--surface2)}
.mi.on{background:var(--indigo-l)}
.mi[disabled]{cursor:not-allowed;opacity:.62}
.mi[disabled]:hover{background:none}
.mi .dt{width:38px;height:38px;border-radius:12px;background:var(--indigo);color:#fff;display:grid;place-items:center;font:800 15px var(--head);flex:none}
.mi.off .dt{background:#9AA0C0}
.mi b{display:block;font:800 15px var(--head);letter-spacing:-.01em}
.mi small{display:block;color:var(--mute);font-size:12.5px;line-height:1.3}
.mi .tx{flex:1;min-width:0}
.mi .ck{color:var(--indigo)}
.dmenu .ft{border-top:1px solid var(--line2);margin:8px 4px 0;padding:10px 8px 4px;font-size:12.5px;color:var(--mute)}
.gs{flex:1;max-width:560px;margin:0 auto;position:relative;min-width:0}
.gs>svg{position:absolute;left:14px;top:15px;color:var(--mute);width:18px;height:18px;pointer-events:none}
.gs .inp{height:46px;padding-left:44px;padding-right:70px;border-radius:14px}
.gs kbd{position:absolute;right:12px;top:12px;font:700 11.5px var(--sans);border:1px solid var(--line);border-radius:7px;padding:2px 8px;color:var(--mute);background:var(--surface2);pointer-events:none}
.gs-list{position:absolute;left:0;right:0;top:52px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 64px rgba(27,31,59,.24);padding:8px;max-height:min(70vh,460px);overflow:auto;z-index:60}
.gs-grp{font:800 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:8px 10px 4px}
.gs-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:12px}
.gs-row:hover,.gs-row.on{background:var(--indigo-l)}
.gs-row b{font-weight:700}
.gs-row small{display:block}
.gs-row .a{display:flex;gap:6px;flex:none}
.gs-none{padding:12px;color:var(--mute)}
.iconb{position:relative;width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink2);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.iconb:hover{border-color:var(--indigo-m);color:var(--indigo-d)}
.iconb .pip{position:absolute;top:9px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--coral);border:2px solid #fff}
.bellwrap{position:relative;flex:none}
.pop{position:absolute;right:0;top:54px;width:340px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 64px rgba(27,31,59,.24);padding:10px;z-index:60}
.pop .hd{font:800 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:8px 12px 6px}
.pop .empty-n{padding:10px 12px;color:var(--mute)}
.pop-i{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;font:inherit;color:var(--ink);padding:10px 12px;border-radius:12px;cursor:pointer}
.pop-i:hover{background:var(--surface2)}
.pop-i .cnt{font:800 12px var(--sans);background:var(--coral);color:#3A1206;border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;padding:0 7px;flex:none}
.pop-i b{display:block}
.pop-i small{display:block}
.who{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px 0 6px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;color:var(--ink2);flex:none;white-space:nowrap}
.who .av{width:34px;height:34px;border-radius:50%;background:var(--indigo-l);color:var(--indigo-d);display:grid;place-items:center;font:700 12.5px var(--head)}
.who .who-t{line-height:1.1;font-weight:700}
.who .who-t small{display:block;font:500 11.5px/1 var(--sans);margin-top:2px}
#tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px;box-shadow:var(--sh);overflow-x:auto;max-width:100%}
#tabs button{display:flex;gap:8px;align-items:center;border:0;background:none;padding:10px 18px;border-radius:99px;font:700 14px var(--sans);color:var(--ink2);cursor:pointer;white-space:nowrap}
#tabs button .ico{display:none}
#tabs button:hover{background:var(--indigo-l);color:var(--indigo-d)}
#tabs button.on{background:var(--indigo);color:#fff;box-shadow:0 4px 12px rgba(66,82,217,.35)}
#tabs .n{font:800 11.5px var(--sans);background:var(--coral);color:#3A1206;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px}
.path{font-size:13px;color:var(--mute);white-space:nowrap}
.path b{color:var(--ink)}

.splash{max-width:560px;margin:60px auto;text-align:center;color:var(--mute);padding:0 16px}
.splash .card{text-align:left;color:var(--ink)}
#boards{max-width:1296px;margin:0 auto;padding:20px 24px 80px}
.board>*+*{margin-top:24px}

/* ---------- page header, stats ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph h1{font:800 34px/1.1 var(--head);letter-spacing:-.03em}
.ph p{margin:8px 0 0;color:var(--mute);max-width:640px;font-size:15px}
.ph .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 20px;box-shadow:var(--sh);display:flex;gap:14px;align-items:center}
.stat i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--indigo-l);color:var(--indigo-d);flex:none;font:800 15px var(--head);font-style:normal}
.stat.c i{background:var(--coral-l);color:#B0391D}
.stat.g i{background:var(--ok-l);color:var(--ok)}
.stat span{display:block;font-size:12.5px;color:var(--mute);font-weight:700}
.stat b{font:800 24px/1.2 var(--head);letter-spacing:-.02em}

/* ---------- cards, forms ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:24px}
.card>h2:first-child,.card>.chead:first-child{margin-top:0}
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.chead h2{letter-spacing:-.01em}
.step{display:flex;align-items:center;gap:12px}
.step i{width:28px;height:28px;border-radius:50%;background:var(--indigo-l);color:var(--indigo-d);display:grid;place-items:center;font:800 13px var(--head);font-style:normal;flex:none}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.grid .span2{grid-column:span 2}
.field label,.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field .req,.req{color:#C2410C}
.hint{font-size:12.5px;color:var(--mute);margin-top:6px;min-height:18px}
.hint.warn{color:var(--warn);font-weight:600}
.hint.bad{color:var(--err);font-weight:600}
.inp{width:100%;height:44px;padding:0 14px;border:1.5px solid var(--field);border-radius:12px;font:inherit;color:var(--ink);background:#fff;min-width:0}
.inp::placeholder{color:#868CAB}
.inp:hover{border-color:#9AA2CC}
.inp:focus{outline:0;border-color:var(--indigo);box-shadow:0 0 0 4px var(--indigo-l)}
.inp:disabled{background:#F0F1F8;color:var(--mute)}
.inp.err{border-color:var(--err);box-shadow:0 0 0 4px var(--err-l)}
textarea.inp{height:44px;min-height:44px;padding:11px 14px;resize:vertical;line-height:1.35}
select.inp{appearance:none;-webkit-appearance:none;padding-right:38px;background-image:linear-gradient(45deg,transparent 50%,#3B4068 50%),linear-gradient(135deg,#3B4068 50%,transparent 50%);background-position:calc(100% - 20px) 19px,calc(100% - 15px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.inp.sm{height:36px;font-size:13.5px;padding:0 10px;border-radius:10px}
select.inp.sm{padding-right:30px;background-position:calc(100% - 16px) 15px,calc(100% - 11px) 15px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--indigo)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--line2)}
.sx{position:relative}
.sx>svg{position:absolute;left:14px;top:13px;color:var(--mute);width:17px;height:17px;pointer-events:none}
.sx .inp{padding-left:42px}

/* customer / lead picker: the switch sits on the field's own label row, the option not chosen is greyed */
.pp-h{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap;margin-bottom:6px;min-height:30px}
.pp-h label{margin:0!important}
.kind{display:inline-flex;gap:2px;background:#E8EAF6;border-radius:99px;padding:3px}
.kind-b{border:0;background:transparent;height:26px;padding:0 12px;border-radius:99px;font:700 12.5px/1 var(--sans);color:#5A6086;cursor:pointer;white-space:nowrap}
.kind-b:hover{color:var(--indigo-d);background:rgba(255,255,255,.7)}
.kind-b.on{background:var(--indigo);color:#fff;cursor:default}
.kind-b:focus-visible{outline:3px solid #8E99F0;outline-offset:1px}
.lead-note{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:9px 12px;border-radius:12px;background:var(--indigo-l);color:var(--ink2);font-size:12.5px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:12px;border:1.5px solid var(--field);background:#fff;color:var(--ink);font:700 14px/1 var(--sans);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface2);border-color:#9AA2CC}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff;box-shadow:0 4px 14px rgba(66,82,217,.32)}
.btn.primary:hover{background:var(--indigo-d);border-color:var(--indigo-d)}
.btn.danger{background:#fff;color:var(--err);border-color:#EFB0B8}
.btn.danger:hover{background:var(--err-l)}
.btn.danger.solid{background:var(--err);border-color:var(--err);color:#fff}
.btn.soft{background:var(--indigo-l);border-color:var(--indigo-l);color:var(--indigo-d)}
.btn.soft:hover{background:#E0E4FF}
.btn.ghost,.btn.link{border-color:transparent;background:transparent;color:var(--indigo-d);box-shadow:none}
.btn.ghost:hover,.btn.link:hover{background:var(--indigo-l)}
.btn.sm{height:34px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.link.sm{padding:0 8px}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.busy::after{content:" \2026"}
.btn svg.ico{width:16px;height:16px}
.x{border:0;background:none;width:36px;height:36px;border-radius:10px;cursor:pointer;color:var(--mute);display:inline-grid;place-items:center;font-size:20px;line-height:1;padding:0}
.x:hover{background:var(--indigo-l);color:var(--indigo-d)}

/* ---------- segmented, chips, toolbar ---------- */
.seg{display:inline-flex;gap:3px;background:#E8EAF6;padding:4px;border-radius:13px;flex-wrap:wrap}
.seg-b{border:0;background:transparent;color:var(--ink2);font:700 13.5px/1 var(--sans);height:34px;padding:0 16px;border-radius:10px;cursor:pointer;white-space:nowrap}
.seg-b:hover{background:rgba(255,255,255,.6)}
.seg-b.on{background:#fff;color:var(--indigo-d);box-shadow:0 1px 4px rgba(27,31,59,.16)}
.seg.chips-s{background:none;padding:0;gap:8px}
.seg.chips-s .seg-b{height:38px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:#fff}
.seg.chips-s .seg-b:hover{border-color:var(--indigo-m);color:var(--indigo-d)}
.seg.chips-s .seg-b.on{background:var(--indigo);border-color:var(--indigo);color:#fff;box-shadow:none}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toolbar h2{font:800 24px/1.1 var(--head);letter-spacing:-.02em;margin:0 8px 0 0}
.toolbar .grow,.grow{flex:1;min-width:170px}
.count{font-size:13px;color:var(--mute);margin:10px 4px 2px}
.sortsel{display:flex;align-items:center;gap:10px}
.sortsel label{font:700 13px var(--sans);color:var(--ink2);white-space:nowrap}

/* ---------- tables as soft rows ---------- */
.tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.t{border-collapse:separate;border-spacing:0 8px;width:100%;min-width:900px}
.t th{text-align:left;font:700 12px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:6px 16px;white-space:nowrap}
.t td{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 16px;vertical-align:middle}
.t td:first-child{border-left:1px solid var(--line);border-radius:16px 0 0 16px}
.t td:last-child{border-right:1px solid var(--line);border-radius:0 16px 16px 0}
.t tbody tr:hover td{background:#FBFBFF;border-color:var(--indigo-m)}
.t th.num,.t td.num{text-align:right}
.t b{font-weight:700}
.t td .sub,.t .sub{display:block;color:var(--mute);font-size:12.5px;font-weight:400}
.t td.acts{white-space:nowrap;text-align:right}
.t td.acts>*+*{margin-left:6px}
.t .clip{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .who2{display:flex;gap:12px;align-items:center}
.t .who2 i{width:38px;height:38px;border-radius:12px;background:var(--indigo-l);color:var(--indigo-d);display:grid;place-items:center;font:800 13px var(--head);font-style:normal;flex:none}
.t td a[href^="tel"]{white-space:nowrap}
.t td select.inp.sm{min-width:130px}
.t td input[type=date].inp.sm{min-width:142px}
.t .who2 div{min-width:170px}
.t tr.sel td{background:var(--indigo-l);border-color:var(--indigo-m)}
.t tr.sel td:first-child{box-shadow:inset 4px 0 0 var(--indigo)}
.t tr.click td{cursor:pointer}
.t .grp td{background:transparent!important;border:0!important;border-radius:0!important;padding:20px 4px 6px}
.empty{padding:34px 16px;text-align:center;color:var(--mute);background:#fff;border:1px dashed var(--field);border-radius:18px}
.late{color:var(--err);font-weight:700}
.dash{color:#A3A8C4}
.sortb{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font:700 12px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--mute);border-radius:6px;padding:2px 4px;margin:-2px -4px}
.sortb:hover{color:var(--indigo-d)}
.sortb:focus-visible{outline:3px solid #8E99F0}
.sortb.on{color:var(--indigo-d)}
.gh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gh .gc{font:800 12px var(--head);background:#fff;border:1px solid var(--line);border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;padding:0 7px;color:var(--ink2)}
.gh .m{color:var(--mute);font-size:13px}

/* ---------- badges, notes ---------- */
.badge{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:#ECEEF7;color:var(--ink2);white-space:nowrap}
.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-blue{background:var(--info-l);color:var(--info)}
.b-green{background:var(--ok-l);color:var(--ok)}
.b-amber{background:var(--warn-l);color:var(--warn)}
.b-red{background:var(--err-l);color:var(--err)}
.note{padding:12px 16px;border-radius:14px;background:var(--warn-l);color:#5E3C00;font-size:13.5px;margin:8px 0}
.note.err{background:var(--err-l);color:var(--err)}

/* ---------- type-ahead ---------- */
.combo{position:relative}
.combo-list{position:fixed;z-index:80;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(27,31,59,.18);padding:6px}
.opt{padding:10px 12px;border-radius:10px;font-weight:500;cursor:pointer}
.opt small{display:block;color:var(--mute);font-size:12.5px;font-weight:400}
.opt.on{background:var(--indigo-l);color:var(--indigo-d);font-weight:700}
.opt.none{color:var(--mute);cursor:default;font-weight:400}

/* ---------- drawer (New lead, New order) ---------- */
.scrim{position:fixed;inset:0;background:rgba(27,31,59,.38);z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100%;background:#fff;z-index:71;box-shadow:-24px 0 60px rgba(27,31,59,.25);display:flex;flex-direction:column}
.drawer.wide{width:780px}
.drawer-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 28px 14px}
.drawer-h h2{font:800 24px var(--head);letter-spacing:-.02em}
.drawer-h p{margin:4px 0 0;color:var(--mute);font-size:13.5px}

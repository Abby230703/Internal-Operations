<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hospi Ops - <?= cfg.label ?></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <?!= include('Styles') ?>
  <?!= include('DeptStyles') ?>
</head>
<body class="dept-<?= cfg.key ?>">
  <!-- PW: this page is built for ONE department (cfg comes from Main.deptConfig): its name, its menu, its boards and files. -->
  <header class="top">
    <div class="top-in">
      <div class="top-r1">
        <div class="brand" id="brand" role="link" tabindex="0" title="Back to the first tab" aria-label="Hospi Ops - back to the first tab"><span class="logo-i">H</span><span class="brand-t">Hospi Ops</span></div>
        <div class="dept">
          <button type="button" class="dsw" id="dept-btn" aria-haspopup="menu" aria-expanded="false">
            <span class="dt" aria-hidden="true"><?= cfg.initial ?></span>
            <span class="tx"><small>Department</small><?= cfg.label ?></span>
            <svg class="ico cv" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="dmenu" id="dept-menu" role="menu" aria-label="Switch department" hidden>
            <div class="hd">Switch department</div>
            <? cfg.menu.forEach(function (d) { ?>
              <? if (d.key === cfg.key) { ?>
            <button type="button" class="mi on" role="menuitem" id="dept-sales"><span class="dt" aria-hidden="true"><?= d.initial ?></span><span class="tx"><b><?= d.label ?></b><small><?= d.sub ?></small></span><svg class="ico ck" viewBox="0 0 24 24" aria-label="Current department"><path d="m5 12 5 5 9-10"/></svg></button>
              <? } else if (d.enabled) { ?>
            <a class="mi" role="menuitem" href="<?= d.url ?>" target="_top"><span class="dt" aria-hidden="true"><?= d.initial ?></span><span class="tx"><b><?= d.label ?></b><small><?= d.sub ?></small></span></a>
              <? } else { ?>
            <button type="button" class="mi off" role="menuitem" disabled><span class="dt" aria-hidden="true"><?= d.initial ?></span><span class="tx"><b><?= d.label ?></b><small>Not available for your role</small></span></button>
              <? } ?>
            <? }); ?>
            <button type="button" class="mi off" role="menuitem" disabled><span class="dt" aria-hidden="true">A</span><span class="tx"><b>Accounts</b><small>Not available yet</small></span></button>
            <button type="button" class="mi off" role="menuitem" disabled><span class="dt" aria-hidden="true">Ad</span><span class="tx"><b>Admin</b><small>Not available yet</small></span></button>
            <div class="ft">Sales, Procurement and Warehouse are switched on. Accounts and Admin screens will appear here when they are added.</div>
          </div>
        </div>
        <div class="gs" id="gs">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="inp" id="gs-input" type="search" autocomplete="off" placeholder="Search customers and leads…" aria-label="Search customers and leads">
          <kbd aria-hidden="true">Ctrl K</kbd>
          <div class="gs-list" id="gs-list" hidden></div>
        </div>
        <span style="flex:1" class="gs-fill"></span>
        <div class="bellwrap">
          <button type="button" class="iconb" id="bell" aria-haspopup="true" aria-expanded="false" aria-label="Things that need attention">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg>
            <span class="pip" id="bell-pip" hidden></span>
          </button>
          <div class="pop" id="bell-pop" hidden></div>
        </div>
        <div id="who" class="who"></div>
      </div>
      <div class="top-r2">
        <nav id="tabs" aria-label="Boards"></nav>
        <div class="path" id="path"></div>
      </div>
    </div>
  </header>
  <div id="splash" class="splash">Loading&hellip;</div>
  <main id="boards" hidden>
    <? cfg.boards.forEach(function (b) { ?>
    <section id="board-<?= b ?>" class="board" hidden></section>
    <? }); ?>
  </main>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <script>window.DEPT = <?!= JSON.stringify(cfg.key) ?>;</script>
  <?!= include('Client') ?>
  <?!= include('DeptShell') ?>
  <? cfg.includes.forEach(function (f) { ?>
  <?!= include(f) ?>
  <? }); ?>
  <script>
    /* PW: if a board file did not load (for example its opening or closing script tag was lost when pasting), say so */
    (function () {
      var want = <?!= JSON.stringify(cfg.boards) ?>, have = App.order.map(function (o) { return o.name; });
      var miss = want.filter(function (b) { return have.indexOf(b) < 0; });
      if (miss.length) setTimeout(function () {
        App.toast('These tabs did not load: ' + miss.join(', ') + '. Open the matching board file in Apps Script: it must start with ' + '<' + 'script> and end with ' + '<' + '/script>.', 'err');
      }, 1200);
    })();
    App.start();
  </script>
</body>
</html>

<script>

  /** Show exactly one order in the Orders list (all statuses), so the person can see it is there. */

  /** Order details open in the side panel (they used to open in a pop-up). Same server call: orders.get. */
  function selectOrder(o, quiet) {

    });

          h('div', { class: 'g' }, h('span', { text: 'Total' }), h('span', { text: 'Rs ' + App.inr(d.total) })))),

  }
  App.register('orders', 'Orders', {
    init: init,
    show: function (p) {

})();
